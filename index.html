<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Visualizador Butterchurn</title>
<style>
  :root {
    --bg: #000;
    --fg: #f2efe6;
    --muted: #a8a397;
    --accent: #f5d76e;
    --ok: #7be38b;
    --warn: #ffb35c;
    --card: rgba(14, 14, 16, 0.92);
    --line: rgba(255, 255, 255, 0.14);
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden;
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  body.idle { cursor: none; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }

  #hud { position: fixed; left: 24px; right: 24px; bottom: 20px; display: flex; align-items: flex-end;
    justify-content: space-between; gap: 16px; pointer-events: none; opacity: 0; transition: opacity .6s ease;
    text-shadow: 0 1px 3px rgba(0,0,0,.9); }
  #hud.show { opacity: 1; }
  #preset { font-size: 15px; max-width: 70vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #preset small { color: var(--accent); margin-left: 8px; font-size: 12px; }
  #status { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; white-space: nowrap; }
  #meter { width: 110px; height: 5px; background: rgba(255,255,255,.18); border-radius: 3px; overflow: hidden; }
  #meter i { display: block; height: 100%; width: 0; background: var(--ok); }

  #toast { position: fixed; top: 22px; left: 50%; transform: translateX(-50%); padding: 8px 14px; border-radius: 8px;
    background: var(--card); border: 1px solid var(--line); font-size: 13px; opacity: 0; transition: opacity .4s; pointer-events: none; }
  #toast.show { opacity: 1; }
  #warn { position: fixed; top: 22px; left: 50%; transform: translateX(-50%); max-width: min(560px, calc(100vw - 32px));
    padding: 10px 14px; border-radius: 8px; background: rgba(40, 24, 6, .92); border: 1px solid var(--warn); color: #ffe2bd;
    font-size: 13px; display: none; }
  #warn.show { display: block; }

  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px;
    background: radial-gradient(ellipse at center, rgba(20,16,40,.82), rgba(0,0,0,.94)); }
  #overlay[hidden] { display: none; }
  .card { width: min(520px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 26px 26px 20px; }
  .card h1 { margin: 0 0 6px; font-size: 22px; font-weight: 650; letter-spacing: .2px; }
  .card p { margin: 8px 0; color: var(--muted); }
  #msg { color: var(--fg); min-height: 1.4em; }
  #msg.err { color: var(--warn); }
  .row { display: flex; gap: 10px; align-items: center; margin: 14px 0 6px; flex-wrap: wrap; }
  label { color: var(--muted); font-size: 13px; }
  select { flex: 1 1 220px; min-width: 0; background: #1c1c20; color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 8px; font: inherit; }
  button { background: var(--accent); color: #1a1606; border: 0; border-radius: 9px; padding: 10px 16px; font: inherit; font-weight: 650; cursor: pointer; }
  button.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); font-weight: 500; }
  .keys { margin-top: 16px; font-size: 12px; color: var(--muted); display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; }
  kbd { font: 11px/1 ui-monospace, Menlo, monospace; background: #26262b; border: 1px solid var(--line); border-radius: 4px; padding: 3px 5px; color: var(--fg); justify-self: start; }
</style>
</head>
<body>
<canvas id="viz"></canvas>

<div id="hud">
  <div id="preset"></div>
  <div id="status"><span id="devName"></span><span id="meter"><i></i></span></div>
</div>
<div id="toast"></div>
<div id="warn"></div>

<div id="overlay">
  <div class="card">
    <h1>Visualizador Butterchurn</h1>
    <p id="msg">Preparando…</p>
    <div class="row" id="devRow" hidden>
      <label for="devSel">Entrada de áudio</label>
      <select id="devSel"></select>
    </div>
    <div class="row">
      <button id="go">Iniciar em tela cheia</button>
      <button id="close" class="ghost" hidden>Voltar ao visual</button>
    </div>
    <div class="keys">
      <kbd>F</kbd><span>tela cheia (ou duplo clique)</span>
      <kbd>→ / Espaço</kbd><span>próximo preset</span>
      <kbd>←</kbd><span>preset anterior</span>
      <kbd>L</kbd><span>travar/destravar o preset atual</span>
      <kbd>↑ / ↓</kbd><span>sensibilidade ao áudio</span>
      <kbd>H</kbd><span>mostrar/esconder nome do preset</span>
      <kbd>Q</kbd><span>qualidade máxima liga/desliga</span>
      <kbd>D</kbd><span>trocar entrada de áudio / este painel</span>
    </div>
  </div>
</div>

<script src="lib/butterchurn.min.js"></script>
<script src="lib/butterchurnExtraImages.min.js"></script>
<script src="lib/butterchurnPresets.min.js"></script>
<script src="lib/butterchurnPresetsExtra.min.js"></script>
<script src="lib/butterchurnPresetsExtra2.min.js"></script>
<script src="lib/butterchurnPresetsMD1.min.js"></script>
<script>
(function () {
  'use strict';

  // ---------- settings (per-browser convenience only) ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem('bcviz:' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('bcviz:' + k, JSON.stringify(v)); } catch (e) { /* ignore */ } }
  };
  const CYCLE_SECONDS = 25;
  const BLEND_SECONDS = 2.7;
  const SILENCE_RMS = 0.0004;

  const $ = (id) => document.getElementById(id);
  const canvas = $('viz'), overlay = $('overlay'), msg = $('msg'), devRow = $('devRow'), devSel = $('devSel');
  const goBtn = $('go'), closeBtn = $('close'), hud = $('hud'), presetEl = $('preset'), devNameEl = $('devName');
  const meterBar = document.querySelector('#meter i'), toastEl = $('toast'), warnEl = $('warn');

  const state = {
    gain: store.get('gain', 1.0),
    hq: store.get('hq', false),
    hudPinned: store.get('hudPinned', false),
    locked: false,
    deviceLabel: '',
    level: 0,
    running: false,
    silentSince: 0,
    nextSwitch: 0
  };

  let hudTimer = 0, idleTimer = 0;
  function setMsg(text, isErr) { msg.textContent = text; msg.classList.toggle('err', !!isErr); }
  let toastTimer = 0;
  function toast(text) {
    toastEl.textContent = text; toastEl.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
  }

  // ---------- library checks ----------
  const bcRoot = window.butterchurn;
  const butterchurn = bcRoot && (bcRoot.default || bcRoot);
  if (!butterchurn || typeof butterchurn.createVisualizer !== 'function') {
    setMsg('Não encontrei a biblioteca do Butterchurn na pasta lib/. Mantenha este arquivo junto da pasta lib.', true);
    goBtn.disabled = true;
    return;
  }

  // ---------- presets ----------
  const presets = {};
  ['butterchurnPresets', 'butterchurnPresetsExtra', 'butterchurnPresetsExtra2', 'butterchurnPresetsMD1'].forEach((name) => {
    const m = window[name]; if (!m) return;
    const mod = m.default || m;
    try { Object.assign(presets, typeof mod.getPresets === 'function' ? mod.getPresets() : mod); } catch (e) { /* skip pack */ }
  });
  const presetNames = Object.keys(presets);
  function shuffled(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  let queue = shuffled(presetNames);
  const history = [];
  let histPos = -1;

  // ---------- audio + visualizer ----------
  const AC = window.AudioContext || window.webkitAudioContext;
  const audioCtx = new AC({ latencyHint: 'interactive' });
  const gainNode = audioCtx.createGain();
  gainNode.gain.value = state.gain;
  const analyser = audioCtx.createAnalyser();
  analyser.fftSize = 1024;
  gainNode.connect(analyser);
  const timeBuf = new Float32Array(analyser.fftSize);

  let visualizer = null, stream = null, sourceNode = null;

  function sizes() {
    const w = Math.max(1, window.innerWidth), h = Math.max(1, window.innerHeight);
    const dpr = window.devicePixelRatio || 1;
    // Cap rendered pixels so big monitors stay fluid; Q switches to native resolution.
    const budget = 4.5e6;
    const pr = state.hq ? dpr : Math.min(dpr, Math.sqrt(budget / (w * h)));
    return { w, h, pr: Math.max(0.5, pr) };
  }
  function resize() {
    const s = sizes();
    canvas.width = Math.round(s.w * s.pr);
    canvas.height = Math.round(s.h * s.pr);
    if (visualizer) visualizer.setRendererSize(s.w, s.h, { pixelRatio: s.pr });
  }
  {
    const s = sizes();
    canvas.width = Math.round(s.w * s.pr); canvas.height = Math.round(s.h * s.pr);
    visualizer = butterchurn.createVisualizer(audioCtx, canvas, { width: s.w, height: s.h, pixelRatio: s.pr, textureRatio: 1 });
    const imgs = window.butterchurnExtraImages && (window.butterchurnExtraImages.default || window.butterchurnExtraImages);
    if (imgs && typeof imgs.getImages === 'function') { try { visualizer.loadExtraImages(imgs.getImages()); } catch (e) { /* optional */ } }
    visualizer.connectAudio(gainNode);
  }
  window.addEventListener('resize', resize);

  function showPreset(name) {
    presetEl.textContent = name;
    if (state.locked) { const s = document.createElement('small'); s.textContent = 'travado'; presetEl.appendChild(s); }
  }
  function loadPresetByName(name, blend) {
    if (!presets[name]) return;
    try { visualizer.loadPreset(presets[name], blend); } catch (e) { return false; }
    store.set('lastPreset', name);
    showPreset(name); pokeHud();
    state.nextSwitch = performance.now() + CYCLE_SECONDS * 1000;
    return true;
  }
  function nextPreset(blend) {
    if (histPos < history.length - 1) { histPos++; loadPresetByName(history[histPos], blend); return; }
    if (!queue.length) queue = shuffled(presetNames);
    const name = queue.pop();
    history.push(name); if (history.length > 200) history.shift();
    histPos = history.length - 1;
    if (loadPresetByName(name, blend) === false) nextPreset(blend);
  }
  function prevPreset() {
    if (histPos > 0) { histPos--; loadPresetByName(history[histPos], 0.8); }
  }
  {
    const last = store.get('lastPreset', null);
    if (last && presets[last]) { history.push(last); histPos = 0; loadPresetByName(last, 0); }
    else nextPreset(0);
  }

  // ---------- input selection ----------
  const isBlackHole = (d) => /blackhole/i.test(d.label || '');
  async function audioInputs() {
    const all = await navigator.mediaDevices.enumerateDevices();
    return all.filter((d) => d.kind === 'audioinput' && d.deviceId !== 'default' && d.deviceId !== 'communications');
  }
  async function permissionState() {
    try { return (await navigator.permissions.query({ name: 'microphone' })).state; } catch (e) { return 'prompt'; }
  }
  function constraints(deviceId) {
    const a = { echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: { ideal: 2 } };
    if (deviceId) a.deviceId = { exact: deviceId };
    return { audio: a, video: false };
  }
  function stopStream() {
    if (sourceNode) { try { sourceNode.disconnect(); } catch (e) { /* ignore */ } sourceNode = null; }
    if (stream) { stream.getTracks().forEach((t) => t.stop()); stream = null; }
  }
  // Opens one specific input (or adopts an already-open stream from it).
  async function openDevice(dev, existing) {
    const next = existing || await navigator.mediaDevices.getUserMedia(constraints(dev.deviceId));
    stopStream();
    stream = next;
    sourceNode = audioCtx.createMediaStreamSource(stream);
    sourceNode.connect(gainNode);
    const track = stream.getAudioTracks()[0];
    const settings = track && track.getSettings ? track.getSettings() : {};
    state.deviceId = settings.deviceId || dev.deviceId;
    state.deviceLabel = (track && track.label) || dev.label || 'entrada de áudio';
    devNameEl.textContent = state.deviceLabel;
    store.set('deviceLabel', state.deviceLabel);
    store.set('deviceId', state.deviceId);
    if (track) track.addEventListener('ended', () => {
      state.running = false;
      showWarn('A entrada “' + state.deviceLabel + '” foi desconectada. Tentando reconectar…');
      setTimeout(() => connect(false), 1500);
    });
  }
  function fillSelect(inputs, chosen) {
    devSel.textContent = '';
    inputs.forEach((d) => {
      const o = document.createElement('option');
      o.value = d.deviceId; o.textContent = d.label || 'Entrada sem nome';
      if (chosen && d.deviceId === chosen.deviceId) o.selected = true;
      devSel.appendChild(o);
    });
    devRow.hidden = inputs.length === 0;
  }
  function pickDevice(inputs) {
    const savedId = store.get('deviceId', null), saved = store.get('deviceLabel', null);
    return inputs.find((d) => savedId && d.deviceId === savedId)
      || inputs.find((d) => saved && d.label === saved)
      || inputs.find(isBlackHole) || null;
  }

  // connect(): open the BlackHole (or saved) input and start rendering. One attempt at a time.
  let connecting = null;
  function connect(fromGesture) {
    if (!connecting) connecting = doConnect(fromGesture).finally(() => { connecting = null; });
    return connecting;
  }
  async function doConnect(fromGesture) {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setMsg('Este navegador não permite captar áudio aqui. Abra esta página no Google Chrome.', true); showOverlay(); return false;
    }
    let tmp = null;
    const dropTmp = () => { if (tmp) { tmp.getTracks().forEach((t) => t.stop()); tmp = null; } };
    try {
      let inputs = await audioInputs();
      let labelsKnown = inputs.some((d) => d.label);
      const savedId = store.get('deviceId', null);
      if (!labelsKnown && savedId && !(stream && stream.active)) {
        // Known input from a previous visit: ask Chrome for that device only (a single, BlackHole-only prompt).
        setMsg('Autorize o acesso ao BlackHole 2ch no aviso do Chrome.');
        try { await openDevice({ deviceId: savedId, label: store.get('deviceLabel', '') }); }
        catch (e) { if (e && (e.name === 'NotAllowedError' || e.name === 'SecurityError')) throw e; }
        inputs = await audioInputs();
        labelsKnown = inputs.some((d) => d.label);
      }
      if (!labelsKnown) {
        // Device names stay hidden until capture is allowed: open a short-lived stream (Chrome asks if needed)
        // and read the names while it is live, then swap to the chosen input.
        setMsg('Autorize o acesso ao áudio no aviso do Chrome (é por aí que o BlackHole chega até aqui).');
        tmp = await navigator.mediaDevices.getUserMedia(constraints(null));
        inputs = await audioInputs();
      }
      const dev = pickDevice(inputs);
      fillSelect(inputs, dev);
      if (!dev) {
        dropTmp();
        setMsg('Não encontrei o BlackHole 2ch. Confira se ele aparece no app Configuração de Áudio e MIDI, ou escolha outra entrada abaixo.', true);
        showOverlay(); return false;
      }
      if (!stream || !stream.active || state.deviceId !== dev.deviceId) {
        const tmpTrack = tmp && tmp.getAudioTracks()[0];
        const tmpId = tmpTrack && tmpTrack.getSettings ? tmpTrack.getSettings().deviceId : null;
        if (tmp && tmpId === dev.deviceId) { await openDevice(dev, tmp); tmp = null; }
        else await openDevice(dev);
      }
      dropTmp();
      if (audioCtx.state !== 'running') { try { await audioCtx.resume(); } catch (e) { /* needs gesture */ } }
      if (audioCtx.state !== 'running') {
        setMsg('Entrada pronta: ' + dev.label + '. Clique para começar.');
        showOverlay(); return false;
      }
      state.running = true; state.wanted = true; hideWarn();
      requestWakeLock();
      return true;
    } catch (e) {
      dropTmp();
      const denied = e && (e.name === 'NotAllowedError' || e.name === 'SecurityError');
      setMsg(denied
        ? 'O acesso ao áudio foi negado. No Chrome, clique no ícone à esquerda do endereço e permita o Microfone; no macOS, confira Ajustes do Sistema › Privacidade e Segurança › Microfone › Google Chrome.'
        : 'Não consegui abrir a entrada de áudio (' + (e && e.name || 'erro') + ').', true);
      showOverlay(); return false;
    }
  }

  devSel.addEventListener('change', async () => {
    const inputs = await audioInputs();
    const dev = inputs.find((d) => d.deviceId === devSel.value);
    if (!dev) return;
    try { await openDevice(dev); setMsg('Entrada: ' + dev.label); toast('Entrada: ' + dev.label); }
    catch (e) { setMsg('Não consegui abrir “' + dev.label + '”.', true); }
  });

  // ---------- overlay / fullscreen ----------
  function showOverlay() { overlay.hidden = false; closeBtn.hidden = !state.running; document.body.classList.remove('idle'); }
  function hideOverlay() { overlay.hidden = true; }
  function toggleFullscreen() {
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    else document.documentElement.requestFullscreen({ navigationUI: 'hide' }).catch(() => toast('Use ⌃⌘F para tela cheia'));
  }
  goBtn.addEventListener('click', async () => {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen({ navigationUI: 'hide' }).catch(() => {});
    try { await audioCtx.resume(); } catch (e) { /* ignore */ }
    if (await connect(true)) { hideOverlay(); pokeHud(); }
  });
  closeBtn.addEventListener('click', () => { if (state.running) hideOverlay(); });
  canvas.addEventListener('dblclick', toggleFullscreen);

  // ---------- HUD, meter, silence warning ----------
  function pokeHud() {
    hud.classList.add('show');
    clearTimeout(hudTimer);
    if (!state.hudPinned) hudTimer = setTimeout(() => hud.classList.remove('show'), 4000);
  }
  function showWarn(t) { warnEl.textContent = t; warnEl.classList.add('show'); }
  function hideWarn() { warnEl.classList.remove('show'); }
  document.addEventListener('mousemove', () => {
    document.body.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => { if (overlay.hidden) document.body.classList.add('idle'); }, 2500);
  });

  function measure(now) {
    analyser.getFloatTimeDomainData(timeBuf);
    let sum = 0; for (let i = 0; i < timeBuf.length; i++) sum += timeBuf[i] * timeBuf[i];
    const rms = Math.sqrt(sum / timeBuf.length);
    state.level = rms;
    meterBar.style.width = Math.min(100, Math.round(Math.sqrt(rms) * 160)) + '%';
    if (!state.running) return;
    if (rms < SILENCE_RMS) {
      if (!state.silentSince) state.silentSince = now;
      if (now - state.silentSince > 5000) showWarn('Nenhum som chegando de “' + state.deviceLabel + '”. Confira se a saída do Mac está em “Minamp + Visualizador” e se o Minamp está tocando.');
    } else { state.silentSince = 0; hideWarn(); }
  }

  function frame(now) {
    try { visualizer.render(); } catch (e) { nextPreset(0); }
    measure(now);
    if (!state.locked && state.running && now >= state.nextSwitch) nextPreset(BLEND_SECONDS);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---------- keyboard ----------
  document.addEventListener('keydown', (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.target === devSel) return;
    const k = e.key;
    if (k === 'f' || k === 'F') { toggleFullscreen(); }
    else if (k === 'ArrowRight' || k === ' ' || k === 'n' || k === 'N') { e.preventDefault(); nextPreset(BLEND_SECONDS); }
    else if (k === 'ArrowLeft' || k === 'p' || k === 'P') { e.preventDefault(); prevPreset(); }
    else if (k === 'l' || k === 'L') { state.locked = !state.locked; showPreset(presetEl.firstChild ? presetEl.firstChild.textContent : ''); toast(state.locked ? 'Preset travado' : 'Troca automática de preset ligada'); pokeHud(); state.nextSwitch = performance.now() + CYCLE_SECONDS * 1000; }
    else if (k === 'ArrowUp' || k === 'ArrowDown') {
      e.preventDefault();
      state.gain = Math.min(8, Math.max(0.125, state.gain * (k === 'ArrowUp' ? 1.25 : 0.8)));
      gainNode.gain.setTargetAtTime(state.gain, audioCtx.currentTime, 0.05);
      store.set('gain', state.gain);
      toast('Sensibilidade ' + Math.round(state.gain * 100) + '%');
    }
    else if (k === 'h' || k === 'H') { state.hudPinned = !state.hudPinned; store.set('hudPinned', state.hudPinned); if (state.hudPinned) pokeHud(); else hud.classList.remove('show'); }
    else if (k === 'q' || k === 'Q') { state.hq = !state.hq; store.set('hq', state.hq); resize(); toast(state.hq ? 'Qualidade máxima' : 'Qualidade equilibrada'); }
    else if (k === 'd' || k === 'D') { if (overlay.hidden) { setMsg(state.deviceLabel ? 'Entrada atual: ' + state.deviceLabel : 'Escolha a entrada.'); showOverlay(); } else if (state.running) hideOverlay(); }
    else if (k === 'Escape' && !overlay.hidden && state.running) { hideOverlay(); }
    else if (!overlay.hidden && (k === 'Enter')) { goBtn.click(); }
  });

  // ---------- keep the screen awake while visualizing ----------
  let wakeLock = null;
  async function requestWakeLock() {
    try { if ('wakeLock' in navigator && document.visibilityState === 'visible') wakeLock = await navigator.wakeLock.request('screen'); } catch (e) { wakeLock = null; }
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && state.running) requestWakeLock(); });

  navigator.mediaDevices && navigator.mediaDevices.addEventListener && navigator.mediaDevices.addEventListener('devicechange', () => {
    if (state.wanted && (!stream || !stream.active)) connect(false);
  });

  // For quick checks from the browser console.
  window.bcviz = {
    level: () => state.level,
    device: () => state.deviceLabel,
    preset: () => (presetEl.firstChild ? presetEl.firstChild.textContent : ''),
    running: () => state.running && audioCtx.state === 'running',
    presets: presetNames.length
  };

  // ---------- start ----------
  (async function boot() {
    const p = await permissionState();
    if (p === 'denied') {
      setMsg('O acesso ao áudio está bloqueado para esta página. Clique no ícone à esquerda do endereço e permita o Microfone, depois recarregue.', true);
      showOverlay();
      return;
    }
    if (p !== 'granted') {
      setMsg('Autorize o áudio no aviso do Chrome. O visual escuta o BlackHole 2ch, por onde passa o som do Minamp.');
      showOverlay();
    }
    // Opens BlackHole right away (asking permission the first time); starts drawing if the browser allows audio.
    if (await connect(false)) { hideOverlay(); toast('Pressione F para tela cheia'); pokeHud(); }
  })();
})();
</script>
</body>
</html>
